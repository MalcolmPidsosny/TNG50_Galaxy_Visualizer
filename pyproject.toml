[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tng50-data-visualizer"
version = "1.0.2"
authors = [
  { name="Malcolm Pidsosny", email="malcolm.pidsosny@gmail.com" },
]
description = "Data visualizer for TNG50 Galaxies in different particle types"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/MalcolmPidsosny/TNG50_Galaxy_Visualizer"
Issues = "https://github.com/MalcolmPidsosny/TNG50_Galaxy_Visualizer/issues"

dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.12.0",
  "illustris_python",
  "scikit-learn",
  "astropy",
  "yt",
]

